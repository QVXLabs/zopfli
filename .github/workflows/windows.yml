name: Windows

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # MSVC is multi-config: build type is chosen at build/test time, not
      # at configure time.
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Test
        run: ./build/${{ matrix.build_type }}/zopfli_tests.exe
