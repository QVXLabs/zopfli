name: Windows

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Windows / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # MSVC is multi-config: build type is chosen at build/test time, not
      # at configure time.
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Test
        run: ./build/${{ matrix.build_type }}/zopfli_tests.exe

  ci:
    # Single stable gate for branch protection (see linux.yml).
    name: Windows CI
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all jobs passed
        if: >-
          ${{ contains(needs.*.result, 'failure')
              || contains(needs.*.result, 'cancelled') }}
        run: exit 1
